events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # SQL Injection Virtual Patch
        if ($query_string ~* "(?i)(?:\\b(?:union\\s+(?:all\\s+)?select|select\\s+.*\\bfrom|insert\\s+into|delete\\s+from|drop\\s+table|update\\s+.*\\bset)\\b|\\bexec(?:ute)?\\s*\\(|'\\s*(?:or|and)\\s+['\\d]=['\\d]|--\\s*$|;\\s*--)") {
            return 403;
        }

        # XSS Virtual Patch
        if ($query_string ~* "(?i)(?:<script[^>]*>|javascript\\s*:|\\bon(?:error|load|click|mouseover|focus|blur)\\s*=|alert\\s*\\(|document\\.(?:cookie|location|domain)|eval\\s*\\()") {
            return 403;
        }

        # Command Injection Virtual Patch
        if ($query_string ~* "(?:;|\\||&&|\\n|\\x60|\\$\\()\\s*(?:cat|ls|id|whoami|curl|wget|bash|sh|powershell|cmd|nc|python|perl|echo)\\b") {
            return 403;
        }

        # SSRF Virtual Patch
        if ($query_string ~* "(?i)(?:https?|gopher|dict|ldap)://(?:127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|169\\.254\\.169\\.254|metadata\\.google\\.internal)") {
            return 403;
        }

        location / {
            proxy_pass http://waf-test-backend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
