RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: SQL Injection (Heuristic) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(?i)(?:\b(?:union\s+(?:all\s+)?select|select\s+.*\bfrom|insert\s+into|delete\s+from|drop\s+table|update\s+.*\bset)\b|\bexec(?:ute)?\s*\(|'\s*(?:or|and)\s+['\d]=['\d]|--\s*$|;\s*--)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: XSS (Strict) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(<script>alert\('xss'\)</script>|<img src=x onerror=alert\('xss'\)>|<iframe src=\x22javascript:alert\('XSS'\)\x22></iframe>|<svg/onload=alert\('xss'\)>|<body onload=alert\('xss'\)>|<a href=javascript:alert\('xss'\)>click</a>|<math href=javascript:alert\(1\)>|javascript:/\*--></title></style></textarea></script></xmp><svg/onload='\+/\x22/\+/onmouseover=1/\+/\[\*/\[\]/\+alert\(1\)//'|<marquee onstart=alert\(1\)>|';alert\(String\.fromCharCode\(88,83,83\)\)//';alert\(String\.fromCharCode\(88,83,83\)\)//\x22|<input onfocus=alert\(1\) autofocus>|%253Cscript%253Ealert%25281%2529%253C%252Fscript%253E|<img src=x onerror=\\u0061\\u006c\\u0065\\u0072\\u0074\\u0028\\u0031\\u0029>|&#60;script&#62;alert&#40;1&#41;&#60;/script&#62;|<ScRiPt>AlErT\(1\)</ScRiPt>|javascript:\\u0061\\u006c\\u0065\\u0072\\u0074\\u0028\\u0031\\u0029|<details open ontoggle=alert\(1\)>)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: XSS (Heuristic) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(?i)(?:<script[^>]*>|javascript\s*:|\bon(?:error|load|click|mouseover|focus|blur)\s*=|alert\s*\(|document\.(?:cookie|location|domain)|eval\s*\()" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: Path Traversal (Strict) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
RewriteCond %{REQUEST_URI} "(\.\./\.\./etc/passwd|\.\./\.\./\.\./\.\./\.\./\.\./\.\./etc/passwd|\.ini|\.\.%2F\.\.%2F\.\.%2F\.\.%2Fetc%2Fpasswd|\.\.%c0%af\.\.%c0%af\.\.%c0%afetc%c0%afpasswd)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: Path Traversal (Heuristic) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
RewriteCond %{REQUEST_URI} "(?:\.\.[\/\\]){2,}|(?:%2e%2e[%2f%5c]){2,}|[\/\\]etc[\/\\](?:passwd|shadow|hosts)|[\/\\](?:boot\.ini|win\.ini|windows[\/\\]system32)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: Command Injection (Strict) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(\$\(cat /etc/passwd\)|\| cat /etc/passwd|; ls -la|& whoami|\| id|; ping -c 10 127\.0\.0\.1|\| nc -lvp 4444)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: Command Injection (Heuristic) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(?:;|\||&&|\n|\x60|\$\()\s*(?:cat|ls|id|whoami|curl|wget|bash|sh|powershell|cmd|nc|python|perl|echo)\b" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: SSRF (Strict) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(http://127\.0\.0\.1/|file:///etc/passwd)" [NC]
RewriteRule ^ - [F,L]

# --- WAF-Checker Virtual Patch: SSRF (Heuristic) ---
# Requires mod_rewrite. Place in httpd.conf, a <VirtualHost>/<Directory>, or .htaccess.
# Prepend "RewriteEngine On" once per context.
# NOTE: %{QUERY_STRING} is URL-encoded; add decoded variants if the app decodes params.
RewriteCond %{QUERY_STRING} "(?i)(?:169\.254\.169\.254|metadata\.google\.internal|127\.0\.0\.1|0\.0\.0\.0|localhost|\[::1\]|instance-data|fd00:)" [NC]
RewriteRule ^ - [F,L]
# ===== proxy the rest to backend =====
RewriteRule ^/?(.*)$ http://waf-test-backend:80/$1 [P,L]
ProxyPassReverse / http://waf-test-backend:80/
