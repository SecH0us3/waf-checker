global
  log stdout format raw local0
defaults
  mode http
  timeout client 10s
  timeout connect 10s
  timeout server 10s
frontend http_front
  bind *:80
# --- WAF-Checker Virtual Patch: SQL Injection (Strict) ---
acl is_sql_injection_query query -m sub -i -- "' OR '1'='1" "1; DROP TABLE notablewaftest17 --" "admin' --" "' OR 1=1--" "' OR 'a'='a" "' OR 1=1#" "' OR 1=1/*" "' OR SLEEP(5)--" "' OR 1=1 LIMIT 1;--" "WAITFOR DELAY '0:0:5'" ")) OR EXISTS(SELECT * FROM users WHERE username='admin')--" "%2553%2527%2520OR%25201%253D1" "/**/OR/**/1=1" "%2527%2520OR%25201%253D1--" "'/**/OR/**/1=1--" "'%09OR%091=1--" "'\\u0020OR\\u00201=1--" "0x27204f52203120314431--" "'UNION/*!50000SELECT*/1,2,3--"
http-request deny deny_status 403 if is_sql_injection_query

# --- WAF-Checker Virtual Patch: SQL Injection (Heuristic) ---
acl is_sql_injection_rx query -m reg -i -- "(?i)(?:\\b(?:union\\s+(?:all\\s+)?select|select\\s+.*\\bfrom|insert\\s+into|delete\\s+from|drop\\s+table|update\\s+.*\\bset)\\b|\\bexec(?:ute)?\\s*\\(|'\\s*(?:or|and)\\s+['\\d]=['\\d]|--\\s*\$|;\\s*--)"
http-request deny deny_status 403 if is_sql_injection_rx

# --- WAF-Checker Virtual Patch: XSS (Strict) ---
acl is_xss_query query -m sub -i -- "<script>alert('xss')</script>" "<img src=x onerror=alert('xss')>" "<iframe src=\"javascript:alert('XSS')\"></iframe>" "<svg/onload=alert('xss')>" "<body onload=alert('xss')>" "<a href=javascript:alert('xss')>click</a>" "<math href=javascript:alert(1)>" "javascript:/*--></title></style></textarea></script></xmp><svg/onload='+/\"/+/onmouseover=1/+/[*/[]/+alert(1)//'" "<marquee onstart=alert(1)>" "';alert(String.fromCharCode(88,83,83))//';alert(String.fromCharCode(88,83,83))//\"" "<input onfocus=alert(1) autofocus>" "%253Cscript%253Ealert%25281%2529%253C%252Fscript%253E" "<img src=x onerror=\\u0061\\u006c\\u0065\\u0072\\u0074\\u0028\\u0031\\u0029>" "&#60;script&#62;alert&#40;1&#41;&#60;/script&#62;" "<ScRiPt>AlErT(1)</ScRiPt>" "javascript:\\u0061\\u006c\\u0065\\u0072\\u0074\\u0028\\u0031\\u0029" "<details open ontoggle=alert(1)>"
http-request deny deny_status 403 if is_xss_query

# --- WAF-Checker Virtual Patch: XSS (Heuristic) ---
acl is_xss_rx query -m reg -i -- "(?i)(?:<script[^>]*>|javascript\\s*:|\\bon(?:error|load|click|mouseover|focus|blur)\\s*=|alert\\s*\\(|document\\.(?:cookie|location|domain)|eval\\s*\\()"
http-request deny deny_status 403 if is_xss_rx

# --- WAF-Checker Virtual Patch: Path Traversal (Strict) ---
acl is_path_traversal_ext path_end -i -- ../../etc/passwd ../../../../../../../etc/passwd .ini ..%2F..%2F..%2F..%2Fetc%2Fpasswd ..%c0%af..%c0%af..%c0%afetc%c0%afpasswd
http-request deny deny_status 403 if is_path_traversal_ext

# --- WAF-Checker Virtual Patch: Path Traversal (Heuristic) ---
acl is_path_traversal_rx path -m reg -i -- "(?:\\.\\.[\\/\\\\]){2,}|(?:%2e%2e[%2f%5c]){2,}|[\\/\\\\]etc[\\/\\\\](?:passwd|shadow|hosts)|[\\/\\\\](?:boot\\.ini|win\\.ini|windows[\\/\\\\]system32)"
http-request deny deny_status 403 if is_path_traversal_rx

# --- WAF-Checker Virtual Patch: Command Injection (Strict) ---
acl is_command_injection_query query -m sub -i -- "\$(cat /etc/passwd)" "| cat /etc/passwd" "; ls -la" "& whoami" "| id" "; ping -c 10 127.0.0.1" "| nc -lvp 4444"
http-request deny deny_status 403 if is_command_injection_query

# --- WAF-Checker Virtual Patch: Command Injection (Heuristic) ---
acl is_command_injection_rx query -m reg -i -- "(?:;|\\||&&|\\n|\\x60|\\\$\\()\\s*(?:cat|ls|id|whoami|curl|wget|bash|sh|powershell|cmd|nc|python|perl|echo)\\b"
http-request deny deny_status 403 if is_command_injection_rx

# --- WAF-Checker Virtual Patch: SSRF (Strict) ---
acl is_ssrf_query query -m sub -i -- "http://127.0.0.1/" "file:///etc/passwd"
http-request deny deny_status 403 if is_ssrf_query

# --- WAF-Checker Virtual Patch: SSRF (Heuristic) ---
acl is_ssrf_rx query -m reg -i -- "(?i)(?:169\\.254\\.169\\.254|metadata\\.google\\.internal|127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost|\\[::1\\]|instance-data|fd00:)"
http-request deny deny_status 403 if is_ssrf_rx
  default_backend http_back
backend http_back
  server s1 waf-test-backend:80
