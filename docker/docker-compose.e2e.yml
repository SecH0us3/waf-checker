services:
  waf-test-backend:
    image: nginx:alpine
    container_name: waf-test-backend
    ports:
      - "8081:80"
    networks:
      - waf-e2e-net

  waf-test-modsec:
    image: owasp/modsecurity-crs:nginx
    container_name: waf-test-modsec
    environment:
      - BACKEND=http://waf-test-backend:80
      - PARANOIA=1
      - ANOMALY_INBOUND=5
    ports:
      - "8088:8080"
    depends_on:
      - waf-test-backend
    networks:
      - waf-e2e-net

  waf-test-caddy:
    image: caddy:alpine
    container_name: waf-test-caddy
    volumes:
      - ./caddy:/etc/caddy:ro
    ports:
      - "8089:80"
    depends_on:
      - waf-test-backend
    networks:
      - waf-e2e-net

  waf-test-haproxy:
    image: haproxy:alpine
    container_name: waf-test-haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8090:80"
    depends_on:
      - waf-test-backend
    networks:
      - waf-e2e-net

  waf-test-nginx:
    image: nginx:alpine
    container_name: waf-test-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8091:80"
    depends_on:
      - waf-test-backend
    networks:
      - waf-e2e-net

networks:
  waf-e2e-net:
    driver: bridge
