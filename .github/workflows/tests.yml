name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its older run. Every other run (each commit
# on main) gets its own group: a group holds one pending run and a newer one
# replaces it, so sharing a group would still drop runs of rapid main commits.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Betterleaks secret scanning
        run: >
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          ghcr.io/betterleaks/betterleaks:v1.9.0@sha256:e3b95b0db6c2735db17165c009b0ad6d9cef34fb4578659232b98f69d7346cac
          git /repo

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The worker and the CLI import @waf-checker/core from its built dist/.
      - name: Build
        run: npm run build

      - name: Core tests
        run: npm test --workspace=@waf-checker/core

      # Each suite runs even if an earlier one failed, so one failure does not
      # hide another.
      - name: CLI tests
        if: ${{ !cancelled() }}
        run: npm test --workspace=@waf-checker/cli

      - name: Worker tests
        if: ${{ !cancelled() }}
        working-directory: packages/worker
        run: npx vitest run

      - name: Worker typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit -p packages/worker
