name = "waf-checker"
main = "src/api.ts"
compatibility_date = "2024-03-29"

[assets]
directory = "./src/static"
binding = "ASSETS"

# Required secrets (set with `wrangler secret put <NAME>`), NOT vars:
#   EMAIL_ENCRYPTION_KEY  — record encryption + blind index key. Without it the
#                           scheduled-monitoring endpoints refuse to serve (503)
#                           rather than fall back to the in-repo dev secret.
#   TURNSTILE_SECRET_KEY  — captcha. Also mandatory outside local development:
#                           without it /api/schedule/subscribe returns 503.
# DEV_MODE = "true" opts a non-loopback deployment into the dev fallbacks above.
# Never set it on a public deployment.

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["waf@secmy.app"]

[[kv_namespaces]]
binding = "MONITOR_KV"
id = "1e4af46d70ef4d38a080421b1103b0c7"
preview_id = "8b7b2a6c087a4b4195f5558134a29c85"

[triggers]
crons = ["0 3 * * *"]