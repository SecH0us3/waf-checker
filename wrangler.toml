name = "waf-checker"
main = "packages/worker/src/api.ts"
compatibility_date = "2024-03-29"

[assets]
directory = "packages/worker/src/static"
binding = "ASSETS"

# Required secrets: EMAIL_ENCRYPTION_KEY and TURNSTILE_SECRET_KEY.
# Both are mandatory outside local development — the scheduled-monitoring
# endpoints return 503 rather than operate without them. See packages/worker/wrangler.toml.

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["waf@secmy.app"]

[[kv_namespaces]]
binding = "MONITOR_KV"
id = "1e4af46d70ef4d38a080421b1103b0c7"
preview_id = "8b7b2a6c087a4b4195f5558134a29c85"

[triggers]
crons = ["0 3 * * *"]

[build]
command = "npm run build"
