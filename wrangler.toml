name = "waf-checker"
main = "packages/worker/src/api.ts"
compatibility_date = "2024-03-29"

[assets]
directory = "packages/worker/src/static"
binding = "ASSETS"

# EMAIL_ENCRYPTION_KEY is required: without it the scheduled-monitoring endpoints
# return 503 rather than fall back to the in-repo dev secret.
# TURNSTILE_SECRET_KEY is optional but strongly recommended (captcha gate).
# See packages/worker/wrangler.toml for the full notes.

# Subrequests per invocation. 10000 is the Workers Paid default; pinned so the
# deployment matches WORKER_SUBREQUEST_LIMIT in packages/core/src/check.ts, which
# sizes scan and audit pages from it. Change both together.
[limits]
subrequests = 10000

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["waf@secmy.app"]

[[kv_namespaces]]
binding = "MONITOR_KV"
id = "1e4af46d70ef4d38a080421b1103b0c7"
preview_id = "8b7b2a6c087a4b4195f5558134a29c85"

[triggers]
crons = ["0 3 * * *"]

[build]
command = "npm run build"
